name: Webhook Live Cluster Integration Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'cli/webhook.py'
      - 'solver/**'
      - 'parser/**'
      - 'encoder/**'
      - 'graph/**'
      - 'k8s/**'
      - 'Dockerfile.webhook'
      - '.dockerignore'
      - '.github/workflows/webhook-live-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'cli/webhook.py'
      - 'solver/**'
      - 'parser/**'
      - 'encoder/**'
      - 'graph/**'
      - 'k8s/**'
      - 'Dockerfile.webhook'
      - '.dockerignore'
      - '.github/workflows/webhook-live-test.yml'

jobs:
  webhook-live-test:
    name: K8s Admission Webhook Live Cluster Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyyaml fastapi uvicorn z3-solver python-hcl2

      - name: Build Docker Image
        run: |
          docker build -t iac-webhook:latest -f Dockerfile.webhook .

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kind

      - name: Load Docker Image into KinD
        run: |
          kind load docker-image iac-webhook:latest --name kind

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.0/cert-manager.yaml
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=cert-manager -n cert-manager --timeout=120s

      - name: Deploy cert-manager Issuer & Certificate
        run: |
          kubectl apply -f k8s/cert-manager-issuer-cert.yaml
          kubectl wait --for=condition=Ready certificate/iac-webhook-cert --timeout=60s

      - name: Enforce Pod Security Standards Restricted Profile
        run: |
          kubectl label --overwrite namespace default pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest

      - name: Deploy Admission Webhook
        run: |
          kubectl apply -f k8s/webhook-deployment.yaml
          kubectl apply -f k8s/webhook-networkpolicy.yaml
          kubectl apply -f k8s/webhook-configuration.yaml

      - name: Verify caBundle Auto-Injection
        run: |
          kubectl get validatingwebhookconfiguration iac-verifier-webhook -o yaml

      - name: Wait for Webhook Readiness
        run: |
          echo "Waiting for admission webhook pod readiness..."
          kubectl wait --for=condition=ready pod -l app=iac-webhook --timeout=60s
          kubectl get pods -o wide

      - name: Test Reject Case (Unsafe Manifest)
        run: |
          echo "=== Testing Reject Case (Unsafe ConfigMap) ==="
          if OUTPUT=$(kubectl apply -f k8s/unsafe-configmap.yaml 2>&1); then
            echo "FAILED: Unsafe ConfigMap was admitted when it should have been rejected!"
            exit 1
          else
            echo "SUCCESS: Admission webhook rejected unsafe ConfigMap."
            echo "$OUTPUT"
            if ! echo "$OUTPUT" | grep -q "Verification failed. Vulnerabilities detected:"; then
              echo "FAILED: Expected rejection error message not found in output!"
              exit 1
            fi
          fi

      - name: Test Admit Case (Safe Manifest)
        run: |
          echo "=== Testing Admit Case (Safe ConfigMap) ==="
          kubectl apply -f k8s/safe-configmap.yaml
          kubectl get configmap safe-infrastructure -o yaml
          echo "SUCCESS: Admission webhook admitted safe ConfigMap."

      - name: Test Unlabeled Bypass Case (Unlabeled Manifest)
        run: |
          echo "=== Testing Unlabeled Bypass Case (Unlabeled Unsafe ConfigMap) ==="
          kubectl apply -f k8s/unlabeled-configmap.yaml
          kubectl get configmap unlabeled-infrastructure -o yaml
          echo "SUCCESS: Unlabeled ConfigMap safely bypassed webhook evaluation via objectSelector."

      - name: Tear Down KinD Cluster
        if: always()
        run: |
          kind delete cluster --name kind || true
