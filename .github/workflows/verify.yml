name: IaC Verification & Test Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pytest-matrix:
    name: Pytest Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Full Pytest Suite with Coverage Enforcement
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=85 -v

  iac-verify:
    name: Verify Terraform Security Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run IaC Verifier Action
        uses: ./
        with:
          path: './fixtures/phase2/sg_restricted_ssh.tf'
          json: 'false'

  sbom:
    name: Generate & Publish Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cert Dependencies & Generate Certs
        run: |
          python -m pip install --upgrade pip
          pip install cryptography
          python k8s/generate_certs.py

      - name: Build Webhook Container Image
        run: |
          docker build -t iac-webhook:latest -f Dockerfile.webhook .


      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate Container Image SBOM (CycloneDX JSON)
        run: |
          syft iac-webhook:latest --output cyclonedx-json=container_sbom.json

      - name: Generate Python Dependency Tree SBOM (CycloneDX JSON)
        run: |
          syft dir:. --exclude "./fixtures/**" --output cyclonedx-json=python_sbom.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            container_sbom.json
            python_sbom.json

      - name: Scan Webhook Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'iac-webhook:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'


