apiVersion: apps/v1
kind: Deployment
metadata:
  name: iac-webhook
  namespace: default
  labels:
    app: iac-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iac-webhook
  template:
    metadata:
      labels:
        app: iac-webhook
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webhook
        image: iac-webhook:latest
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8443
          name: https
        env:
        - name: WEBHOOK_TIMEOUT_SECONDS
          value: "8.0"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          tcpSocket:
            port: 8443
          initialDelaySeconds: 2
          periodSeconds: 2
        volumeMounts:
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: iac-webhook-tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: iac-webhook-service
  namespace: default
spec:
  ports:
  - port: 443
    targetPort: 8443
    name: https
  selector:
    app: iac-webhook
