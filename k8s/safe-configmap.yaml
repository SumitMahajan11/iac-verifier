apiVersion: v1
kind: ConfigMap
metadata:
  name: safe-infrastructure
  namespace: default
  labels:
    iac-verifier/scan: "true"
data:
  main.tf: |
    resource "aws_security_group" "safe_sg" {
      name = "safe-sg"
      ingress {
        from_port = 443
        to_port = 443
        protocol = "tcp"
        cidr_blocks = ["10.0.0.0/8"]
      }
    }
