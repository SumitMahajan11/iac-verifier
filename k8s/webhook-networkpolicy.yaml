apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iac-webhook-network-policy
  namespace: default
  labels:
    app: iac-webhook
spec:
  podSelector:
    matchLabels:
      app: iac-webhook
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8443
  egress: []
