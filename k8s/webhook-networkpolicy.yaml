apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iac-webhook-network-policy
  namespace: default
  labels:
    app: iac-webhook
spec:
  podSelector:
    matchLabels:
      app: iac-webhook
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Note: Allows HTTPS 8443 traffic from kube-system namespace and same-namespace (default) pods.
  # In production non-kind clusters, API server traffic originates from control-plane nodes / host network,
  # which may require specific ipBlock or control-plane namespace rules.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8443
  # Default Deny Egress: The webhook process performs zero outbound network calls (logs to stdout, exposes /metrics for scraping).
  egress: []
