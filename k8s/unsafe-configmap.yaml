apiVersion: v1
kind: ConfigMap
metadata:
  name: unsafe-infrastructure
  namespace: default
data:
  main.tf: |
    resource "aws_security_group" "unsafe_sg" {
      name = "unsafe-sg"
      ingress {
        from_port = 22
        to_port = 22
        protocol = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }
