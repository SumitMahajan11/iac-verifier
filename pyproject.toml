[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-verifier"
version = "0.0.1"
requires-python = ">=3.10"

dependencies = [
    "z3-solver",
    "python-hcl2",
    "pyyaml",
    "click",
    "structlog",
    "prometheus-client",
    "fastapi",
    "uvicorn",
    "cryptography",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
